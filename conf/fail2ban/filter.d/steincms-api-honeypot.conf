# Honeypot hits on api requests such as login or event registration (HTTP 403).
# Copy to /etc/fail2ban/filter.d/ and enable steincms-api-honeypot jail.
# Edit failregex: replace {admin.path} with siteConfig.admin.path (e.g. /drachenboothafen).

[Definition]

datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S (%%z|%%h%%m|%%Z?)

failregex = ^<HOST> - \S+ \S+ \[<DATE>\] "POST /api/ HTTP/[0-9.]+" 403

ignoreregex =
