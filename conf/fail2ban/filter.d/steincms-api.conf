# Failed admin login credentials (HTTP 401).
# Copy to /etc/fail2ban/filter.d/ and enable steincms-api jail.
# Use a high maxretry (15–20) so typo-prone humans are not banned.
# Edit failregex: replace {admin.path} with siteConfig.admin.path (e.g. /drachenboothafen).

[Definition]

datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S (%%z|%%h%%m|%%Z?)

failregex = ^<HOST> - \S+ \S+ \[<DATE>\] "POST /api/ HTTP/[0-9.]+" 401

ignoreregex =
