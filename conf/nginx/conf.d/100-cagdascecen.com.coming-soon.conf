include /etc/nginx/bot-map.conf;

### redirect to https
server {
    listen [::]:80;
    listen 80;
    server_name cagdascecen.com;

    include /etc/nginx/server-common-blocking-rules.conf;

    rewrite     ^   https://www.cagdascecen.com$request_uri permanent;

    access_log /var/log/nginx/cagdascecen-access.log combined;
    error_log /var/log/nginx/cagdascecen-error.log;
}

server {
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    server_name www.cagdascecen.com;

    access_log /var/log/nginx/cagdascecen-access.log combined buffer=128k;
    error_log /var/log/nginx/cagdascecen-error.log;

    # file caching
    open_file_cache max=1024 inactive=10s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # authentication
    auth_basic           "Secure";
    auth_basic_user_file /etc/nginx/.htpasswd.cagdascecen;

    include /etc/nginx/server-common-blocking-rules.conf;
    include /etc/nginx/server-non-php-wp-site-blocking-rules.conf;

    # exception pages
    error_page 404 /404.html;

    location / {
        gzip_static on;
        brotli_static on;

        root /var/www/cagdascecen.com/;
    }

    #location /_astro/ {
    #    gzip_static on;
    #    brotli_static on;
    #
    #    limit_req zone=relaxed burst=40;
    #
    #    root /var/www/cagdascecen.com/;
    #    expires 1y;
    #}

    ssl_certificate /etc/letsencrypt/live/cagdascecen.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cagdascecen.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}