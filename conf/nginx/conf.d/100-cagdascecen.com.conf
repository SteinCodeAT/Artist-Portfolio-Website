server {
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    server_name www.cagdascecen.com;

    access_log /var/log/nginx/cagdascecen-access.log combined buffer=128k;
    error_log /var/log/nginx/cagdascecen-error.log;

    # file caching
    open_file_cache max=1024 inactive=10s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # authentication
    # auth_basic           "Secure";
    # auth_basic_user_file /etc/nginx/.htpasswd.cagdascecen;

    include /etc/nginx/server-common-blocking-rules.conf;
    include /etc/nginx/server-non-php-wp-site-blocking-rules.conf;

    # exception pages
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- maintenance switch ---
    set $maint "";
    if (-f /etc/nginx/maintenance_flags/cagdascecen.flag) { set $maint "M"; }
    if ($bypass_maintenance = 0)              { set $maint "${maint}B"; }
    if ($maint = "MB")                  { return 503; }
    # --------------------------

    error_page 503 @maintenance;

    location @maintenance {
        root /var/www/cagdascecen.com/;
        add_header Retry-After 3600 always;
        rewrite ^(.*)$ /wartung.html break;
    }

    # Maximum body size
    client_max_body_size 1m;

    # Astro client assets — served directly from disk for caching
    location /_astro/ {
        limit_req zone=relaxed burst=40 nodelay;

        gzip_static on;
        brotli_static on;

        root /var/www/cagdascecen.com/astro;
        expires 1y;
        access_log off;
    }

    # CMS uploads — written by Node, never wiped by deploy rsync
    location /media/ {
        limit_req zone=relaxed burst=40 nodelay;

        alias /var/www/cagdascecen.com/media/;
        expires 30d;
        access_log off;
    }

    location = /ghostadmin/login {
        limit_req zone=sensitive burst=2 nodelay;

        include /etc/nginx/proxy-pass-settings.conf;
        
        proxy_pass http://127.0.0.1:4329;
    }

    location /api/update-events {
        limit_req zone=sensitive burst=5 nodelay;

        include /etc/nginx/proxy-pass-settings.conf;
        
        proxy_pass http://127.0.0.1:4329;
    }

    location /api/posts {
        limit_req zone=sensitive burst=5 nodelay;

        include /etc/nginx/proxy-pass-settings.conf;
        
        proxy_pass http://127.0.0.1:4329;
    }

    location /api/upload-image {
        limit_req zone=sensitive burst=5 nodelay;
        client_max_body_size 10m;

        include /etc/nginx/proxy-pass-settings.conf;

        proxy_pass http://127.0.0.1:4329;
    }

    location /_image {
        limit_req zone=relaxed burst=60 nodelay;

        include /etc/nginx/proxy-pass-settings.conf;

        proxy_pass http://127.0.0.1:4329;
    }
    location / {
        limit_req zone=relaxed burst=20 nodelay;

        include /etc/nginx/proxy-pass-settings.conf;

        proxy_pass http://127.0.0.1:4329;
    }

    ssl_certificate /etc/letsencrypt/live/www.cagdascecen.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.cagdascecen.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
