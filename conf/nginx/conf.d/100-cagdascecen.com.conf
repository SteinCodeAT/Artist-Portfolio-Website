geo $bypass_maintenance {
    default        0;
    84.115.233.194  1;
    2a02:8388:15be:d480:c8d8:b417:b344:3a18 1;
}

### rewite to www
server {
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
